name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bible-hymn.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bible-hymn.apk \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋: ${{ github.sha }} — 폰에서 bible-hymn.apk를 눌러 받아 설치하세요." \
            --target ${{ github.sha }}

      # 빌드 결과(성공/실패)를 build-log 브랜치에 남겨서 채팅에서도 확인할 수 있게 한다
      - name: Save build log
        if: always()
        run: |
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > build-status.txt
          mkdir -p /tmp/log && cp build.log build-status.txt /tmp/log/ 2>/dev/null || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github .gitignore
          cp /tmp/log/* .
          git add build.log build-status.txt
          git commit -m "build #${{ github.run_number }}: ${{ job.status }}"
          git push -f origin build-log
